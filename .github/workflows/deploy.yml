name: deploy

# Every push to main: set up / update Supabase, deploy the push functions, test everything against the
# real backend, then publish the app to GitHub Pages. Only one secret is needed: SUPABASE_ACCESS_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN 비밀값이 없어요. 저장소 Settings → Secrets and variables → Actions에서 추가해 주세요."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set up Supabase (project, sign-in, database, secrets)
        run: node scripts/provision.mjs

      - name: Deploy the push functions
        run: supabase functions deploy --project-ref "$UD_REF" --no-verify-jwt

      - name: Stamp the version
        run: |
          V="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          printf '{"v":"%s"}\n' "$V" > web/version.json
          printf "window.UD_VERSION = '%s';\n" "$V" >> web/config.js

      - name: Test the backend (two people, a stranger, photos, push plumbing)
        run: node tests/e2e/api.mjs

      - name: Test the app in a browser (two phones)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node tests/e2e/ui.mjs

      - name: Keep the test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/shots
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: pages
        uses: actions/deploy-pages@v4
