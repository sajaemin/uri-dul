<style>
/* VOICE everyday and tender, but grown-up: a calm, native-feeling iPhone app
   IDEA a shipped iOS app: grouped cards on a soft ground, translucent bars, a Live Activity on top
   PICTURE the hero card: days-together number in thin numerals on a rose-to-wine glow; the island where two avatars move toward each other as the date nears
   COLOUR soft grey-rose ground, white cards, near-black ink, one rose accent; indigo for plans, amber for anniversaries; night = true black with lifted cards
   TYPE the iPhone system face (SF + Apple SD Gothic Neo), Noto Sans KR as fallback; thin weights for big numbers
   LAYOUT one phone column (max 560px); sticky island under the header; tab bar fixed at the bottom */
:root{color-scheme:light;--bg:light-dark(#f3f1f2,#000000);--card:light-dark(#ffffff,#161416);--ink:light-dark(#17151a,#f3f1f2);--mut:light-dark(#86808a,#9b959c);--acc:light-dark(#e1446a,#ff6f90);--acc2:light-dark(#fcecf0,#35161f);--line:light-dark(rgba(23,21,26,.09),rgba(255,255,255,.1));--fill:light-dark(rgba(23,21,26,.05),rgba(255,255,255,.07));--plan:light-dark(#5263e8,#8a96ff);--ann:light-dark(#d98b1c,#f3b24c);--hol:light-dark(#e0443e,#ff6b64);--out:light-dark(#e7e4e6,#000000)}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--out);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;letter-spacing:-.01em;word-break:keep-all;min-height:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:clip}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:.5px solid var(--line);position:sticky;top:0;z-index:6}
.brand{font-size:19px;font-weight:700;letter-spacing:-.04em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.tag{font-size:13px;color:var(--mut);border:.5px solid var(--line);border-radius:999px;padding:0 8px;line-height:22px;white-space:nowrap}
.who{margin-left:auto;display:flex;background:var(--fill);border-radius:999px;padding:2px}
.who button{border:0;background:none;font-size:14px;padding:0 13px;border-radius:999px;color:var(--mut);min-height:36px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.who button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{flex:1;position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.app.gated main{padding-bottom:24px}
.app.has-di main{padding-top:50px}
nav.tabs{position:sticky;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
nav.tabs button{border:0;background:none;font-size:13px;color:var(--mut);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;font-weight:500}
nav.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--acc)}
nav.tabs button[aria-current=page] svg{stroke-width:2.1}
.dot{position:absolute;top:4px;left:calc(50% + 7px);min-width:19px;height:19px;border-radius:10px;background:var(--acc);color:#fff;font-size:13px;line-height:19px;padding:0 5px;font-weight:600;font-variant-numeric:tabular-nums}
/* hero */
.hero{margin:6px 16px 0;border-radius:28px;padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.32),transparent 55%),radial-gradient(80% 70% at 0% 100%,rgba(70,10,45,.55),transparent 70%),linear-gradient(155deg,#ff8ba3 0%,#e1446a 45%,#6a1f4e 100%);box-shadow:0 20px 40px -22px rgba(225,68,106,.7)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.22);pointer-events:none}
.hero::before{width:260px;height:260px;right:-90px;bottom:-120px}
.hero::after{width:180px;height:180px;right:-50px;bottom:-80px;border-color:rgba(255,255,255,.14)}
.pair{display:flex;align-items:center}
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:15px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.75);color:#fff;flex:none}
.pair .av+.av{margin-left:-10px}
.hl{margin:12px 0 0;font-size:15px;font-weight:500;opacity:.95}
.hero .n{font-size:clamp(68px,21vw,104px);font-weight:200;letter-spacing:-.055em;line-height:.95;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.hero .n span{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-left:6px}
.hs{margin:0;font-size:14px;opacity:.9}
/* dynamic island */
.di-wrap{position:absolute;left:0;right:0;top:100%;height:0;display:flex;justify-content:center;pointer-events:none}
.di-wrap:empty{display:none}
.di{pointer-events:auto;position:absolute;top:9px;background:#000;color:#fff;border:0;border-radius:22px;height:38px;min-width:150px;max-width:calc(100% - 40px);padding:0 14px 0 8px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 0 0 1px light-dark(rgba(255,255,255,.06),rgba(255,255,255,.16));font-size:14px;text-align:left}
.di .l{display:flex;align-items:center;gap:8px;min-width:0}
.pulse{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#ff6f90 0 35%,rgba(255,111,144,.25) 36% 100%);flex:none}
.di .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:10em;font-weight:600}
.di .cd{margin-left:auto;color:#ff8aa5;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.di.exp{height:auto;border-radius:38px;width:min(390px,calc(100% - 20px));max-width:none;display:block;padding:18px 22px 16px}
.di.exp>span{display:block}
.dix-top{display:flex!important;justify-content:space-between;gap:10px;font-size:13px;color:rgba(255,255,255,.6)}
.dix-lab{color:#ff8aa5;font-weight:600;white-space:nowrap}
.dix-when{text-align:right;overflow-wrap:anywhere}
.dix-t{font-size:18px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.dix-big{font-size:46px;font-weight:200;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:4px}
/* meet track: two people closing the distance */
.meet{display:block;position:relative;height:36px;margin:12px 2px 2px}
.meet .tr,.meet .fl,.meet .fr{position:absolute;top:50%;height:2px;margin-top:-1px;border-radius:1px}
.meet .tr{left:14px;right:14px;background:var(--line)}
.di .meet .tr{background:rgba(255,255,255,.18)}
.meet .fl,.meet .fr{background:var(--acc);width:0}
.meet .fl{left:0}
.meet .fr{right:0}
.meet .av{position:absolute;top:50%;width:30px;height:30px;font-size:13px;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid var(--acc);color:var(--ink);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.di .meet .av{background:#1b1b1d;color:#fff}
.meet .mh{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);fill:none;stroke:var(--mut);stroke-width:2}
.meet.met .mh{fill:var(--acc);stroke:var(--acc);width:20px;height:20px;top:-6px;z-index:1}
/* content */
.sec{padding:4px 16px 18px}
.sh{font-size:13px;color:var(--mut);margin:22px 6px 8px;font-weight:600;letter-spacing:0}
.card{background:var(--card);border-radius:20px;padding:18px}
.card+.card{margin-top:12px}
h2{font-weight:650;font-size:17px;letter-spacing:-.025em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:14px;color:var(--mut);font-weight:500;letter-spacing:0}
.q{font-size:clamp(20px,5.6vw,24px);font-weight:650;line-height:1.38;letter-spacing:-.035em;margin:2px 0 0;text-wrap:balance}
.note{color:var(--mut);font-size:14px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font-weight:600;border:0;border-radius:14px;min-height:48px;padding:0 18px;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:16px}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.line{background:var(--fill);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.btn:active,.ib:active,.tile:active,.cell:active{transform:scale(.97)}
textarea,select,input[type=text],input[type=date],input[type=time]{min-height:48px;-webkit-appearance:none;appearance:none;font:inherit;font-size:16px;width:100%;border:1px solid transparent;border-radius:12px;padding:12px 14px;background:var(--fill);color:var(--ink)}
textarea:focus,select:focus,input:focus{border-color:var(--acc);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--mut);margin:14px 2px 6px;font-weight:600}
.bub{background:var(--fill);border-radius:18px 18px 18px 6px;padding:12px 15px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px}
.lock{background:var(--fill);border-radius:16px;padding:14px 15px;margin-top:6px;color:var(--mut);font-size:15px}
.who-l{font-size:13px;font-weight:600;margin-top:16px;display:block;color:var(--mut)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.list li:first-child{padding-top:2px}
.list li:last-child{border-bottom:0;padding-bottom:0}
.dd{font-size:15px;font-weight:600;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.date{color:var(--mut);font-size:14px;white-space:nowrap}
.banner{display:flex;align-items:center;gap:10px;background:var(--acc2);color:var(--acc);padding:10px 16px;font-size:15px;font-weight:500}
.banner button{margin-left:auto;border:0;background:none;color:var(--acc);min-height:40px;padding:0 6px;font-size:14px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:11px;padding:2px;margin:14px 0 12px}
.seg button{border:0;background:none;min-height:38px;border-radius:9px;color:var(--ink);font-size:14px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:16px;overflow:hidden}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--fill);overflow:hidden;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tb{position:absolute;left:6px;top:6px;background:var(--acc);color:#fff;font-size:13px;line-height:20px;padding:0 7px;border-radius:10px;font-weight:600}
.tb.ok{background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.thumbs .tile{aspect-ratio:1;border-radius:10px}
.up{border-radius:20px;padding:18px;text-align:center;background:var(--card);border:1.5px dashed color-mix(in srgb,var(--acc) 40%,transparent)}
.up .btn{margin:10px auto 0}
.empty{text-align:center;color:var(--mut);padding:28px 12px;font-size:15px}
/* photo viewer */
.ov{position:fixed;inset:0;max-width:560px;margin:0 auto;background:rgba(0,0,0,.96);color:#fff;display:flex;flex-direction:column;z-index:8;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.ov .bar{display:flex;align-items:center;gap:8px}
.ov .bar button{border:0;background:rgba(255,255,255,.14);color:#fff;min-height:40px;min-width:44px;border-radius:999px;padding:0 14px;font-weight:600}
.ov .pic{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;min-height:0}
.ov .pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.ov .meta{font-size:15px;opacity:.85;margin:0 0 10px;overflow-wrap:anywhere}
.ov .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.toast{position:fixed;left:16px;right:16px;max-width:528px;margin:0 auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:500;z-index:9;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast.on{opacity:1;transform:none}
ol.steps{margin:4px 0 0;padding-left:20px;color:var(--ink);font-size:15px}
ol.steps li{margin:5px 0}
/* next date card */
.nd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.nd-t{font-size:20px;font-weight:650;letter-spacing:-.03em}
.nd-cd{font-size:15px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;margin-top:6px;text-align:center}
/* calendar */
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh h2{margin:0;flex:1;text-align:center;justify-content:center;font-size:19px}
.ib{border:0;background:var(--fill);border-radius:12px;min-width:44px;min-height:40px;font-size:20px;color:var(--ink);line-height:1}
.ib.sm{font-size:14px;min-height:34px;min-width:0;padding:0 12px;flex:none;font-weight:600;border-radius:999px}
.calbox{background:var(--card);border-radius:20px;padding:12px 8px 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{text-align:center;font-size:13px;color:var(--mut);padding:2px 0 6px;font-weight:600}
.sun .dn,.cal .wd.sun{color:var(--hol)}
.sat .dn,.cal .wd.sat{color:var(--plan)}
.cell{border:0;background:none;border-radius:12px;min-height:52px;display:flex;flex-direction:column;align-items:center;padding:3px 0 4px;gap:3px;font-size:16px;font-variant-numeric:tabular-nums}
.cell.out{opacity:.3}
.cell .dn{width:34px;height:34px;line-height:34px;border-radius:17px;text-align:center}
.cell.today .dn{color:var(--acc);font-weight:700}
.cell.sel .dn{background:var(--ink);color:var(--bg);font-weight:600}
.cell.sel.today .dn{background:var(--acc);color:#fff}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.k-date{background:var(--acc)}
.k-plan{background:var(--plan)}
.k-anniv,.k-bday{background:var(--ann)}
.k-hol{background:var(--hol)}
.k-photo{background:var(--mut)}
.tagk{font-size:13px;padding:0 8px;border-radius:7px;white-space:nowrap;display:inline-block;line-height:21px;font-weight:600;vertical-align:1px}
.tagk.k-date{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
.tagk.k-plan{color:var(--plan);background:color-mix(in srgb,var(--plan) 13%,transparent)}
.tagk.k-anniv,.tagk.k-bday{color:var(--ann);background:color-mix(in srgb,var(--ann) 15%,transparent)}
.tagk.k-hol{color:var(--hol);background:color-mix(in srgb,var(--hol) 13%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin:10px 8px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ag li{align-items:flex-start}
.ag .t{width:3.4em;flex:none;color:var(--mut);font-size:14px;white-space:nowrap;padding-top:1px;font-variant-numeric:tabular-nums}
.ag .m{flex:1;overflow-wrap:anywhere}
.ag .s{font-size:14px;color:var(--mut)}
.remind{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 45%,transparent)}
.sheet-bg{position:fixed;inset:0;max-width:560px;margin:0 auto;background:rgba(0,0,0,.4);z-index:7;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-size:13px;color:var(--mut);padding:0 2px;margin-bottom:2px;font-weight:600}
.chk{display:inline-flex;align-items:center;gap:7px;margin:4px 14px 4px 0;min-height:40px;font-size:15px}

/* envelopes in the paper's colour, first sticker as the seal */
.env.pp-mint .ei{background:linear-gradient(160deg,#e4f8ef,#bfead6)}.env.pp-mint .ei::before{background:#cdeedf}
.env.pp-butter .ei{background:linear-gradient(160deg,#fff6d6,#ffe39a)}.env.pp-butter .ei::before{background:#ffeab3}
.env.pp-lilac .ei{background:linear-gradient(160deg,#f3ecff,#dccbff)}.env.pp-lilac .ei::before{background:#e6daff}
.env.pp-sky .ei{background:linear-gradient(160deg,#e9f4ff,#c4e0ff)}.env.pp-sky .ei::before{background:#d6e9ff}
.env.pp-kraft .ei{background:linear-gradient(160deg,#ecdcbc,#d8bf92)}.env.pp-kraft .ei::before{background:#e2cda6}
.env .ei.has-seal::after{display:none}
.env .ei .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-style:normal;font-size:17px;line-height:1;z-index:1}

/* hearts and the two characters */
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.gcol{background:var(--fill);border-radius:16px;padding:10px 12px 8px;min-width:0}
.gcol.mine{background:linear-gradient(180deg,#ffe1eb,#fff3f7);box-shadow:inset 0 0 0 2px #ffcadb}
.gn{margin:0;font-size:13px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:4px}
.gn .mini{flex:none}
.gs{display:block;font-size:18px;margin-top:2px}
.app[data-look=cute] .gs{font-family:Jua,sans-serif;font-weight:400}
.gh{margin:2px 0 6px;font-weight:800;color:var(--acc);font-size:15px}
.gh small{font-weight:700;color:#e8a100;font-size:12.5px}
.gx{margin:5px 0 0;font-size:12px}
.gift{margin:10px 0 0;font-size:13.5px;font-weight:700;color:var(--ink);background:#fff6d9;border-radius:12px;padding:7px 10px}
.hlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.hlist li{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:12px;padding:8px 12px;font-size:14.5px}
.hlist li .ht{flex:1;min-width:0}
.hlist li .ht small{color:var(--mut);font-size:12px;margin-left:2px}
.hlist li b{color:var(--acc);font-size:14px}
.hlist li.done{background:#fff;box-shadow:inset 0 0 0 2px #ffdce8}
.hlist li.done .ht{color:var(--mut);text-decoration:line-through;text-decoration-color:#ffb3c9}
.hk{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #ffc2d5;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.hlist li.done .hk{background:var(--acc);box-shadow:none}
.hk svg{width:15px;height:15px}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hchip{background:var(--fill);border-radius:999px;padding:5px 11px;font-size:13px}
.hchip b{color:var(--acc)}
.hpop{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:linear-gradient(180deg,#ff86ad,#ff5c8d);color:#fff;font-weight:800;font-size:18px;border-radius:999px;padding:8px 18px;box-shadow:0 10px 24px -6px rgba(255,92,141,.7);pointer-events:none;animation:hpop 1.6s ease-out forwards}
@keyframes hpop{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1;transform:translate(-50%,-26px) scale(1)}100%{opacity:0;transform:translate(-50%,-50px)}}
@media(prefers-reduced-motion:reduce){.hpop{animation:none;opacity:1}}

/* the yard */
.yard{position:relative;isolation:isolate;width:100%;height:clamp(200px,58vw,240px);overflow:hidden;--sky1:#ffd3e3;--sky2:#fff0f5;--g1:#bfe8c9;--g2:#aadfb9;--ge:#86c99c;--gf:#d6f1de;--fence:#fff;background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 17%,var(--gf) 17%);user-select:none;-webkit-user-select:none}
.yard.th-sakura{--sky1:#ffe0ee;--sky2:#fff6fa;--g1:#ffd3e2;--g2:#ffc2d6;--ge:#efa3bd;--gf:#ffe8f0}
.yard.th-beach{--sky1:#bfe4ff;--sky2:#eef8ff;--g1:#ffe7b6;--g2:#ffdda0;--ge:#e9bf7a;--gf:#9fd8f2;--fence:#fff8e8}
.yard.th-snow{--sky1:#dce8f8;--sky2:#f5f9ff;--g1:#ffffff;--g2:#eef4ff;--ge:#c9d8ee;--gf:#e6effb}
.yard.th-autumn{--sky1:#ffd9b8;--sky2:#fff3e6;--g1:#f3d9a4;--g2:#ecc98a;--ge:#d6a865;--gf:#f7e6c4}
.yard.th-candy{--sky1:#e6d9ff;--sky2:#fdf0ff;--g1:#ffd6ec;--g2:#d9f1ff;--ge:#e7b3d6;--gf:#f3e8ff}
.yard.th-night{--sky1:#2e2f63;--sky2:#5d4f92;--g1:#4f8a77;--g2:#467e6c;--ge:#2c5a4c;--gf:#34525e;--fence:#d9d4ee}
.yard.big{height:clamp(250px,74vw,300px);border-radius:20px}
.yplot{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none}
.yard.th-night .crn{background:#ffffffd9}
.ysnow,.ystars,.ypetal,.yrain{position:absolute;inset:0;pointer-events:none;z-index:0}
.ydeco{position:absolute;left:0;top:0;width:100%;height:19%;z-index:0;pointer-events:none}
.ydeco .ycl{opacity:.92}
.yard.th-night .ydeco .ycl{opacity:.25}
.ysnow{z-index:120;background-image:radial-gradient(circle,#fff 1.6px,transparent 2px),radial-gradient(circle,#fff 1.1px,transparent 1.5px);background-size:34px 34px,22px 22px;animation:snowf 9s linear infinite}
@keyframes snowf{to{background-position:0 34px,11px 44px}}
.ystars{background-image:radial-gradient(circle,#fff8 1.2px,transparent 1.6px);background-size:26px 14px;height:17%}
.ypetal{z-index:120;background-image:radial-gradient(ellipse 3.5px 2.2px at 30% 40%,#ff9fbb 70%,transparent 72%),radial-gradient(ellipse 2.6px 1.8px at 70% 20%,#ffb8cc 70%,transparent 72%);background-size:53px 61px,37px 43px;animation:petalf 13s linear infinite;opacity:.85}
@keyframes petalf{to{background-position:-26px 61px,18px 86px}}
.yrain{bottom:auto;height:19%;background:radial-gradient(ellipse 60% 190% at 50% 100%,transparent 62%,#a9c8ffaa 62.5% 66%,#a8e6cfaa 66.5% 70%,#ffd36baa 70.5% 74%,#ffb3c9aa 74.5% 78%,transparent 78.5%)}
.yi{position:absolute;z-index:2;transform:translate(-50%,-90%);line-height:1;filter:drop-shadow(0 3px 2px rgba(60,40,50,.16));pointer-events:none}
.yi.a-sway{transform-origin:50% 100%;animation:ysway 4s ease-in-out var(--d) infinite}
.yi.a-bob{animation:ybob 3s ease-in-out var(--d) infinite}
.yi.a-pet{animation:ypet 10s ease-in-out var(--d) infinite}
.yi.a-fly{animation:yfly 7s ease-in-out var(--d) infinite}
.yi.a-drift{animation:ydrift 18s ease-in-out var(--d) infinite}
.yi.a-spin{animation:ybob 5s ease-in-out var(--d) infinite}
.yi.a-twinkle{animation:ytw 2.4s ease-in-out var(--d) infinite}
@keyframes ysway{0%,100%{transform:translate(-50%,-90%) rotate(-3deg)}50%{transform:translate(-50%,-90%) rotate(3deg)}}
@keyframes ybob{0%,100%{transform:translate(-50%,-90%)}50%{transform:translate(-50%,-104%)}}
@keyframes ypet{0%,100%{transform:translate(-80%,-90%) scaleX(1)}24%{transform:translate(-20%,-90%) scaleX(1)}26%{transform:translate(-20%,-90%) scaleX(-1)}30%{transform:translate(-20%,-110%) scaleX(-1)}34%{transform:translate(-20%,-90%) scaleX(-1)}74%{transform:translate(-80%,-90%) scaleX(-1)}76%{transform:translate(-80%,-90%) scaleX(1)}}
@keyframes yfly{0%,100%{transform:translate(-90%,-90%)}25%{transform:translate(-30%,-150%)}50%{transform:translate(20%,-100%)}75%{transform:translate(-40%,-60%)}}
@keyframes ydrift{0%,100%{transform:translate(-80%,-90%)}50%{transform:translate(-20%,-90%)}}
@keyframes ytw{0%,100%{opacity:1;transform:translate(-50%,-90%) scale(1)}50%{opacity:.55;transform:translate(-50%,-90%) scale(.8)}}
.cr{position:absolute;width:calc(clamp(62px,19vw,80px) * var(--s,1));padding:0;border:0;background:none;transform:translate(-50%,-92%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.yard:not(.big) .cr{width:calc(clamp(56px,16vw,70px) * var(--s,1))}
.cr svg{display:block;width:100%;height:auto;overflow:visible;transform:scaleX(var(--f,1))}
.cr .crn{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#ffffffe6;border-radius:999px;padding:0 7px;font-size:10.5px;font-weight:800;color:#5a2b40;white-space:nowrap;line-height:16px}
.cr.walk .cbody{animation:cwalk .42s ease-in-out infinite}
.cr.walk .cfeet ellipse:first-child{animation:cfoot .42s ease-in-out infinite}
.cr.walk .cfeet ellipse:last-child{animation:cfoot .42s ease-in-out .21s infinite}
.cr.hop .cbody{animation:chop .55s cubic-bezier(.3,.7,.4,1) 2}
.cr .ceyes{animation:cblink 4.5s infinite;transform-origin:0 -3px}
.cr .cwing{animation:cwing .6s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes cwalk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes cfoot{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes chop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.1,.88)}55%{transform:translateY(-22px) scale(.94,1.06)}}
@keyframes cblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cwing{to{transform:scaleY(.82)}}
.crb{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);background:#fff;color:#5a2b40;font-size:12.5px;font-weight:800;border-radius:12px;padding:4px 9px;white-space:nowrap;box-shadow:0 4px 10px rgba(90,43,64,.18);animation:crb 1.5s ease-out forwards;pointer-events:none}
@keyframes crb{0%{opacity:0;transform:translate(-50%,6px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.ymeet{position:absolute;transform:translate(-50%,0);font-size:22px;z-index:130;pointer-events:none;animation:ymeet 1.8s ease-out forwards}
@keyframes ymeet{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
@media(prefers-reduced-motion:reduce){.yi,.cr .cbody,.cr .ceyes,.cr .cwing,.ysnow,.ypetal{animation:none!important}}
.yard.edit{box-shadow:inset 0 0 0 3px var(--acc)}
.yard.edit .yi{pointer-events:auto;cursor:grab;touch-action:none;animation:none;outline:2px dashed #ff5c8d66;outline-offset:2px;border-radius:8px}
.yard.edit .yi.drag{cursor:grabbing;transform:translate(-50%,-90%) scale(1.15);z-index:200!important}
.yard.edit .cr{opacity:.45;pointer-events:none}
.hero.cute .yard{border-radius:0}
.ytools{margin-top:12px}
.ytools .btn{flex:1}
.yedit-bar{margin-top:12px;background:var(--fill);border-radius:16px;padding:12px}
.ystore{display:flex;flex-wrap:wrap;gap:6px}
.ysb{border:0;background:#fff;border-radius:12px;width:46px;height:46px;font-size:26px;box-shadow:inset 0 0 0 2px var(--line)}
/* the shop */
.wallet{background:linear-gradient(135deg,#ffe1eb,#fff0e4);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.wallet .wl{font-size:13px;font-weight:700;color:var(--mut)}
.wallet b{font-size:26px;color:var(--acc)}
.app[data-look=cute] .wallet b{font-family:Jua,sans-serif;font-weight:400}
.wallet .note{font-size:12px}
.stabs{margin-bottom:10px}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sitem{background:var(--fill);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sitem .se{font-size:36px;line-height:1.1}
.sitem b{font-size:13.5px}
.sitem small{font-size:11.5px}
.sbuy{min-height:34px;padding:0 10px;font-size:13px;border-radius:999px;width:100%}
.sbuy:disabled{background:#ead9e0!important;color:#9b7480;box-shadow:none!important;font-size:11.5px}
.sown{font-size:13px;font-weight:800;color:var(--acc);min-height:34px;display:flex;align-items:center}
.sth{display:block;width:100%;height:46px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 50%,var(--g1) 50%)}
.sth.th-spring{--sky1:#ffd3e3;--sky2:#fff0f5;--g1:#bfe8c9}.sth.th-sakura{--sky1:#ffe0ee;--sky2:#fff6fa;--g1:#ffc2d6}.sth.th-beach{--sky1:#bfe4ff;--sky2:#eef8ff;--g1:#ffe7b6}.sth.th-snow{--sky1:#dce8f8;--sky2:#f5f9ff;--g1:#fff}.sth.th-autumn{--sky1:#ffd9b8;--sky2:#fff3e6;--g1:#f3d9a4}.sth.th-candy{--sky1:#e6d9ff;--sky2:#fdf0ff;--g1:#ffd6ec}.sth.th-night{--sky1:#2e2f63;--sky2:#5d4f92;--g1:#4f8a77}

/* today's photo, above the yard */
.dphoto{display:flex;align-items:center;gap:14px;padding:16px 18px 12px 20px;position:relative}
.dpt{flex:1;min-width:0}
.dpk{margin:0;font-size:12.5px;font-weight:800;color:var(--acc)}
.app[data-look=cute] .dpk{font-family:Jua,sans-serif;font-weight:400;font-size:14px}
.dpc{margin:2px 0 0;font-size:17px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpw{margin:2px 0 0;font-size:13px;color:var(--mut)}
.dpn{margin:6px 0 0;font-size:11.5px;color:var(--mut)}
.polaroid.dp{position:relative;right:auto;top:auto;flex:none;width:clamp(96px,30vw,132px);transform:rotate(5deg);margin:6px 6px 2px 0}
.app[data-look=cute] .hero.cute.has-photo::before{display:none}

.seg5{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg5 button{font-size:13.5px;padding:0 2px;position:relative}
.sdot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.glock{background:linear-gradient(135deg,#fff6d9,#ffe9f0)}
/* home photos: just the pictures */
.dphoto{display:flex;justify-content:center;align-items:flex-start;gap:16px;padding:18px 16px 12px}
.dphoto .polaroid.dp{width:min(54%,210px);margin:0;transform:rotate(var(--r))}
.dphoto.two .polaroid.dp{width:min(42%,168px)}
.dphoto.two .polaroid.dp:last-child{margin-top:14px}
.pcap{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11.5px;font-weight:800;color:#a8738a}
.app[data-look=cute] .pcap{font-family:Jua,sans-serif;font-weight:400;font-size:13px}

/* comments */
.cmts{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cmt{position:relative;background:var(--fill);border-radius:14px 14px 14px 4px;padding:7px 30px 7px 11px;font-size:14.5px;line-height:1.4;align-self:flex-start;max-width:92%;overflow-wrap:anywhere}
.cmt.me{background:#ffe1eb;border-radius:14px 14px 4px 14px;align-self:flex-end}
.cmt .cb{display:block;font-size:11.5px;font-weight:800;color:var(--acc)}
.cmt .cw{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.cdel{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;background:none;color:var(--mut);font-size:16px;line-height:1;padding:0}
.cmt-in{display:flex;gap:6px;margin-top:2px}
.cmt-in input{flex:1;min-width:0;min-height:40px;border-radius:999px;padding:0 14px;font-size:16px}
.cmt-go{flex:none;border:0;border-radius:999px;background:var(--acc);color:#fff;font-weight:800;padding:0 14px;min-height:40px;font-size:14px}
.cmt-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:10px;border:0;background:none;padding:2px 0;color:var(--acc);font-weight:800;font-size:13.5px;text-align:left;width:100%}
.cmt-last{display:block;color:var(--mut);font-weight:500;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .cmt-t{margin-top:6px}
.cmc{color:var(--acc)!important;font-weight:700}
.tile .tcm{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:#5a2b40;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.cmts.dark{max-height:30vh;overflow-y:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch}
.cmts.dark .cmt{background:rgba(255,255,255,.14);color:#fff}
.cmts.dark .cmt.me{background:rgba(255,120,165,.35)}
.cmts.dark .cmt .cb{color:#ffc2d5}
.cmts.dark .cmt .cw,.cmts.dark .cdel{color:rgba(255,255,255,.6)}
.cmts.dark .cmt-in input{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.cmts.dark .cmt-in input::placeholder{color:rgba(255,255,255,.55)}

/* feeding, moods, holding */
.gfull{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;font-size:12.5px;font-weight:800;color:var(--ink)}
.gmood{font-weight:700;color:var(--mut)}
.fbar i{background:linear-gradient(90deg,#ffd36b,#ffa54d)}
.fbar.low i{background:linear-gradient(90deg,#ff9a8a,#ff6b6b)}
.feedb{display:block;width:100%;margin-top:8px;border:0;border-radius:999px;background:#fff3d6;color:#a8650b;font-weight:800;font-size:13.5px;min-height:36px;box-shadow:inset 0 0 0 2px #ffe0a3}
.feedwho{display:flex;gap:6px;margin-bottom:10px}
.cr{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cr.held{filter:drop-shadow(0 14px 10px rgba(90,43,64,.28));transition:none!important}
.cr.held svg{animation:cheld .5s ease-in-out infinite alternate}
@keyframes cheld{from{transform:scaleX(var(--f,1)) translateY(-14px) rotate(-6deg)}to{transform:scaleX(var(--f,1)) translateY(-18px) rotate(6deg)}}
.cr.drop .cbody{animation:cdrop .55s cubic-bezier(.3,.7,.4,1)}
@keyframes cdrop{0%{transform:translateY(-16px)}55%{transform:translateY(0) scale(1.12,.86)}80%{transform:translateY(-4px) scale(.96,1.04)}100%{transform:none}}
.czz{position:absolute;right:-4px;top:2px;font-size:15px;animation:czz 2.4s ease-in-out infinite;pointer-events:none}
.czz.hg{font-size:12px;background:#fff;border-radius:10px;padding:1px 5px;box-shadow:0 2px 6px rgba(90,43,64,.15);right:-10px}
@keyframes czz{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-6px);opacity:1}}
.cfood{position:absolute;left:50%;top:-6px;font-size:26px;transform:translateX(-50%);animation:cfood 1.1s ease-in forwards;pointer-events:none}
@keyframes cfood{0%{transform:translate(-50%,-40px) scale(1.2);opacity:0}30%{opacity:1}80%{transform:translate(-50%,26px) scale(.8);opacity:1}100%{transform:translate(-50%,34px) scale(.2);opacity:0}}
.ypetal.yleaf{background-image:radial-gradient(ellipse 4px 2.5px at 30% 40%,#e8823a 70%,transparent 72%),radial-gradient(ellipse 3px 2px at 70% 20%,#f2b44a 70%,transparent 72%)}
@media(prefers-reduced-motion:reduce){.cr.held svg,.czz,.cfood{animation:none!important}}

/* drawn yard things */
.yi svg{display:block;width:1em;height:1em;overflow:visible}
.yi.emo{line-height:1}
.yi{transform:translate(-50%,-94%)}
.yi.roam{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.yi.roam svg{transform:scaleX(var(--f,1))}
.yi.roam.walk svg{animation:petwalk .34s ease-in-out infinite}
.yi.roam.hop svg{animation:pethop .6s cubic-bezier(.3,.7,.4,1)}
.yi.a-fly.roam svg,.yi.a-fly.roam.walk svg{animation:petfly 1.6s ease-in-out infinite}
@keyframes petwalk{0%,100%{transform:scaleX(var(--f,1)) translateY(0) rotate(-4deg)}50%{transform:scaleX(var(--f,1)) translateY(-12%) rotate(4deg)}}
@keyframes pethop{0%,100%{transform:scaleX(var(--f,1)) translateY(0)}20%{transform:scaleX(var(--f,1)) scale(1.08,.9)}55%{transform:scaleX(var(--f,1)) translateY(-40%)}}
@keyframes petfly{0%,100%{transform:scaleX(var(--f,1)) translateY(-30%)}50%{transform:scaleX(var(--f,1)) translateY(-60%)}}
.sitem .se svg{display:block;margin:0 auto}
.ysb svg{display:block;margin:0 auto}
@media(prefers-reduced-motion:reduce){.yi.roam svg{animation:none!important}}
.ythemes{margin:10px 0 0}
.sth.mini{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:5px;vertical-align:-2px}
.sitem.bon{box-shadow:inset 0 0 0 2px #ff9fbb}
.ytools .btn{padding-left:8px;padding-right:8px}

/* food on the lawn and eating */
.yfood{position:absolute;width:1em;height:1em;transform:translate(-50%,-88%);pointer-events:none;filter:drop-shadow(0 2px 1.5px rgba(60,40,50,.18))}
.yfood svg,.yfood .femo{position:absolute;left:0;top:0;width:1em;height:1em}

const CL_MS = [3, 10, 20, 35, 50, 75, 100];

    for (const m of clMs(fs.length)) {

      part.forEach(f => { cnt[f.name] = (cnt[f.name] || 0) + 1; });
      const fav = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || '밥', last = fs[m - 1];

}

  <div class="sec">${joinParam ? `<p class="sh">초대를 받았어요</p><div class="card"><p class="note">앱을 연 뒤 이 초대 코드를 넣어 주세요</p><div class="bigcode">${esc(joinParam)}</div><div class="row"><button class="btn ghost" type="button" data-act="copy-join">코드 복사</button></div></div>` : ''}
  ${inApp() ? `<div class="card" style="margin-top:12px;border:2px solid var(--acc)"><b>Safari로 열어 주세요</b><p class="note" style="margin-top:4px">지금은 ${esc(inApp())} 안에서 열려 있어서 홈 화면에 추가할 수 없어요. 오른쪽 아래(또는 위) 메뉴에서 <b>'Safari로 열기'</b> 또는 <b>'다른 브라우저로 열기'</b>를 눌러 주세요.</p><div class="row"><button class="btn ghost" type="button" data-act="copy-url">주소 복사</button></div></div>` : ''}
  <p class="sh">홈 화면에 추가해 주세요</p><div class="card"><ol class="steps big"><li>Safari 오른쪽 아래 <b>⋯</b>(점 세 개) → <b>공유</b>를 눌러요. <span class="note">(iOS 18 이하: 아래쪽 공유 버튼)</span></li><li>목록을 위로 올려 <b>'홈 화면에 추가'</b>를 눌러요.</li><li><b>'웹 앱으로 열기'</b>가 켜진 채로 오른쪽 위 <b>추가</b>를 눌러요.</li><li>아이폰 바탕화면(앱 아이콘들 있는 곳)에 생긴 <b>'우리 둘'</b> 아이콘으로 열어요.</li></ol><p class="note" style="margin-top:10px">홈 화면 앱으로 열어야 알림을 받을 수 있어요. 아이폰 iOS 16.4 이상이 필요해요.</p></div>
  <div class="row" style="justify-content:center"><button class="btn line" type="button" data-act="gate-browser">알림 없이 브라우저에서 쓰기</button></div></div>`;
}
function vPair() {
  return `${S.look === 'cute' ? `<div class="hero cute">${scene(1)}<div class="hin"><p class="hl">반가워요</p><div class="n" style="font-size:clamp(34px,10vw,48px)">둘을 이어 볼까요?</div></div></div>` : `<div class="hero"><div class="hin"><p class="hl">반가워요</p><div class="n" style="font-size:clamp(36px,10vw,52px);font-weight:300">둘을 이어 볼까요?</div></div></div>`}
  <div class="sec"><p class="sh">처음이에요</p><div class="card"><p style="margin:0">내가 먼저 시작하고, 상대에게 초대 코드를 보내요.</p><div class="row"><button class="btn wide" type="button" data-act="gate-create">새로 시작하기</button></div></div>
  <p class="sh">초대를 받았어요</p><form class="card" id="jf"><label class="f" for="j-code" style="margin-top:0">초대 코드 6자리</label><input type="text" id="j-code" maxlength="6" autocapitalize="characters" autocomplete="off" value="${esc(joinParam)}" placeholder="예: K7QM2D" style="text-transform:uppercase;letter-spacing:.2em;font-weight:600"><button class="btn wide" type="submit" style="margin-top:12px">연결하기</button></form>
  <p class="sh">폰을 바꿨어요</p><form class="card" id="rf"><p class="note" style="margin:0 0 4px">초대 코드와 설정에 있던 내 복구 코드를 넣으면 기록을 되찾아요.</p><label class="f" for="r-code">초대 코드</label><input type="text" id="r-code" maxlength="6" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"><label class="f" for="r-rc">내 복구 코드 8자리</label><input type="text" id="r-rc" maxlength="8" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"><button class="btn line wide" type="submit" style="margin-top:12px">기록 되찾기</button></form></div>`;
}
function vGate() {
  if (S.gate === 'install') return vInstall();
  if (S.gate === 'pair') return vPair();
  if (S.gate === 'error') return `<div class="sec"><div class="card" style="margin-top:20px">${emptyArt()}<h2>${S.gateErr === 'anon' ? '로그인 설정이 꺼져 있어요' : '연결하지 못했어요'}</h2><p class="note">${S.gateErr === 'anon' ? 'Supabase 프로젝트에서 Authentication → Sign In / Providers → Allow anonymous sign-ins를 켜 주세요.' : '인터넷 연결을 확인하고 다시 시도해 주세요.'}</p><div class="row"><button class="btn" type="button" data-act="gate-retry">다시 시도</button></div></div></div>`;
  return `<div class="empty" style="padding-top:90px">${emptyArt()}연결하는 중…</div>`;
}
function vInvite() {
  if (!S.real || !S.info || S.info.partner_joined) return '';
  return `<p class="sh">${esc(nm('partner'))}님을 초대해 주세요</p><div class="card invite"><p class="note">초대 코드</p><div class="bigcode">${esc(S.info.code)}</div><div class="row"><button class="btn" type="button" data-act="invite-share" style="flex:1">초대 링크 보내기</button><button class="btn line" type="button" data-act="invite-copy">코드 복사</button></div><p class="note" style="margin-top:10px">${esc(nm('partner'))}님이 링크를 열어 홈 화면에 추가한 뒤, 앱에서 이 코드를 넣으면 연결돼요.</p></div>`;
}
function vPushBanner() {
  if (!S.real || !S.info || !S.info.partner_joined || ls.get('ud-push-hide') === '1') return '';
  if (S.push === 'off') return `<div class="card pushc"><div style="flex:1"><b>알림 켜기</b><p class="note" style="margin-top:2px">${esc(nm(other()))}님 소식과 기념일을 바로 받아요</p></div><button class="btn" type="button" data-act="push-on">켜기</button></div>`;
  if (S.push === 'need-install') return `<div class="card pushc"><div style="flex:1"><b>홈 화면에 추가하면 알림이 와요</b><p class="note" style="margin-top:2px">Safari 공유 버튼 → 홈 화면에 추가</p></div><button class="btn line" type="button" data-act="push-hide">닫기</button></div>`;
  return '';
}
function vRealSettings() {
  if (!S.real || !S.info) return '';
  const st = {on: '이 폰에서 알림을 받고 있어요', off: '알림이 꺼져 있어요', denied: '설정 앱 → 알림 → 우리 둘에서 알림을 허용해 주세요', 'need-install': '홈 화면에 추가한 앱에서만 알림을 켤 수 있어요', unsupported: '이 기기에서는 알림을 지원하지 않아요'}[S.push] || '확인하는 중…';
  return `<p class="sh">알림</p><div class="card"><p style="margin:0">${st}</p><div class="row">${S.push === 'on' ? '<button class="btn ghost" type="button" data-act="push-test">테스트 알림 보내기</button><button class="btn line" type="button" data-act="push-off">끄기</button>' : S.push === 'off' ? '<button class="btn" type="button" data-act="push-on">알림 켜기</button>' : ''}</div>${vNotifChoices()}</div>
  <p class="sh">연결</p><div class="card"><p style="margin:0">${S.info.partner_joined ? `${esc(nm('me'))}님과 ${esc(nm('partner'))}님이 연결되어 있어요` : '아직 상대가 들어오지 않았어요'}</p><p class="note" style="margin-top:8px">초대 코드</p><div class="bigcode sm">${esc(S.info.code)}</div>${S.info.partner_joined ? '' : '<div class="row"><button class="btn" type="button" data-act="invite-share">초대 링크 보내기</button></div>'}</div>
  <p class="sh">홈 화면 위젯</p><div class="card"><p style="margin:0">함께한 날, 다음 데이트 D-day, ${esc(nm(other()))}님 기분과 새 사진을 홈 화면과 잠금 화면에 띄워요.</p><p class="note" style="margin-top:6px">웹앱은 아이폰 위젯을 직접 만들 수 없어서, 무료 앱 Scriptable이 대신 보여줘요.</p>
  <ol class="steps"><li>App Store에서 <b>Scriptable</b>(무료)을 설치해요.</li><li>아래 <b>위젯 코드 복사</b>를 눌러요.</li><li>Scriptable을 열고 오른쪽 위 <b>+</b> → 빈 화면을 길게 눌러 <b>붙여넣기</b> → 맨 위 이름을 <b>우리 둘</b>로 바꾸고 <b>완료</b>.</li><li>홈 화면 빈 곳을 길게 누르고 <b>편집 → 위젯 추가 → Scriptable</b>에서 크기를 골라 추가해요.</li><li>추가된 위젯을 길게 눌러 <b>위젯 편집 → Script → 우리 둘</b>을 골라요.</li></ol>
  <p class="note" style="margin-top:6px"><b>마당 위젯</b>: 위젯을 하나 더 추가해서 같은 '우리 둘'을 고르고, <b>위젯 편집 → Parameter</b>에 <b>마당</b>이라고 적으면 우리 마당이 위젯이 돼요. 위젯은 움직일 수 없어서, 15분쯤마다 캐릭터가 다른 자리에서 놀고 있어요.</p>
  <p class="note" style="margin-top:6px">배경을 우리 사진으로: 위젯을 길게 눌러 <b>위젯 편집 → Parameter</b>에 <b>사진</b>이라고 적으면, 위젯 배경 사진(사진함에서 '위젯 배경으로')이 위젯 배경이 돼요. 위젯 코드를 예전에 붙여넣었다면 한 번 더 복사해 바꿔 주세요.</p>
  <p class="note" style="margin-top:6px">잠금 화면: 잠금 화면을 길게 눌러 <b>사용자화 → 잠금 화면 → 위젯 칸</b>에서 Scriptable을 넣고 똑같이 '우리 둘'을 골라요.</p>
  <div class="row"><button class="btn" type="button" data-act="wg-copy" style="flex:1">위젯 코드 복사</button><button class="btn line" type="button" data-act="wg-reset">키 바꾸기</button></div>
  ${S.wgShow && S.wgCode ? `<label class="f" for="wg-code">복사가 안 되면 아래를 길게 눌러 전체 선택 → 복사</label><textarea id="wg-code" readonly style="min-height:120px;font-size:12px;font-family:ui-monospace,monospace">${esc(S.wgCode)}</textarea>` : ''}
  <p class="note" style="margin-top:10px">위젯 코드에는 내 위젯 키가 들어 있어요. 다른 사람에게 보내지 마세요. '키 바꾸기'를 누르면 예전 위젯은 멈춰요.</p></div>
  <p class="sh">내 복구 코드</p><div class="card"><div class="bigcode sm">${esc(S.info.rc || '')}</div><p class="note" style="margin-top:8px">폰을 바꾸거나 앱을 지웠을 때, 초대 코드와 이 코드로 내 기록을 되찾아요. 캡처해서 보관해 두세요. 다른 사람에게는 보여 주지 마세요.</p><div class="row"><button class="btn line" type="button" data-act="rc-copy">복구 코드 복사</button></div></div>`;
}
async function realBoot() {
  S.real = true; $('.app').classList.add('real');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  setTimeout(checkUpdate, 4000);
  if (!isStandalone() && ls.get('ud-browser-ok') !== '1') { S.gate = 'install'; S.loaded = true; render(); return; }
  await realStart();
}
async function realStart() {
  S.gate = 'loading'; S.loaded = true; render();
  try { S.info = await UDB.start(); }
  catch (e) { S.gate = 'error'; S.gateErr = e && e.code === 'anon_disabled' ? 'anon' : 'net'; render(); return; }
  if (!S.info) { S.gate = 'pair'; render(); return; }
  openCouple();
}
function openCouple() {
  const o = UDB.open(S.info); db = o.db; assets = o.assets; dl = o.dl;
  S.who = S.info.role; S.gate = null; S.mode = 'db'; S.loaded = false;
  render();
  attachDB(setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000));
  UDB.watchCouple(S.info.couple_id, async () => { try { S.info = await UDB.info(); render(); } catch (e) {} });
  refreshPush();
  prepWidget();
}
async function prepWidget(reset) {
  try {
    const [t, tpl] = await Promise.all([UDB.widgetToken(reset), S.wgTpl ? S.wgTpl : fetch('widget.scriptable.js', {cache: 'no-cache'}).then(r => r.text())]);
    S.wgTpl = tpl; S.wgCode = tpl.replace('__WIDGET_URL__', UDB.widgetUrl(t)).replace('__APP_URL__', location.origin + location.pathname.replace(/[^/]*$/, ''));
    return true;
  } catch (e) { return false; }
}
async function gateDo(fn, okMsg) {
  try { S.info = await fn(); if (!S.info) throw {code: 'unavailable'}; burst(16); toast(okMsg); openCouple(); }
  catch (e) { const c = e && e.code; toast(c === 'code_not_found' ? '그 코드를 찾지 못했어요. 다시 확인해 주세요' : c === 'couple_full' ? '이미 두 사람이 연결된 코드예요' : c === 'bad_recovery' ? '복구 코드가 맞지 않아요' : '연결하지 못했어요. 잠시 뒤 다시 해 주세요'); }
}
/* blob cache so the share sheet opens inside the tap */
const BC = new Map(), RB = new Map();
function blobOf(p) {
  if (!BC.has(p.id)) BC.set(p.id, fetch(src(p)).then(r => { if (!r.ok) throw new Error('fetch'); return r.blob(); }).then(b => { RB.set(p.id, b); return b; }).catch(e => { BC.delete(p.id); throw e; }));
  return BC.get(p.id);
}
function prefetchPhotos() {
  if (!S.real || !dl) return;
  if (S.viewer) { const p = S.photos.find(x => x.id === S.viewer); if (p) blobOf(p).catch(() => {}); }
  if (S.tab === 'ph') received().filter(unsaved).slice(0, 30).forEach(p => blobOf(p).catch(() => {}));
}

async function boot() {
  if (window.UDB && UDB.available) { realBoot(); return; }
  render();
  const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
  const c = window.claude;
  if (c && c.use) { try { [db, assets, dl] = await Promise.all([c.use('db'), c.use('assets'), c.use('downloads')]); } catch (e) {} }
  if (!db) { clearTimeout(timer); S.mode = 'mem'; S.loaded = true; render(); return; }
  S.mode = 'db';
  attachDB(timer);
}
function attachDB(timer) {
  db.doc('couple/main').onSnapshot(s => {
    S.couple = s.exists ? s.data() : null;
    if (!s.metadata.fromCache || s.exists) { S.loaded = true; S.slow = false; clearTimeout(timer); }
    render();
  }, () => { clearTimeout(timer); S.loaded = true; S.err = '데이터를 불러오지 못했어요. 페이지를 다시 열어 주세요.'; render(); });
  db.collection('answers').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.answers = m; render(); }, () => {});
  db.collection('photos').orderBy('at', 'desc').limit(500).onSnapshot(s => { S.photos = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, () => {});
  db.collection('memories').onSnapshot(s => { S.memories = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, () => {});
  db.collection('bucket').onSnapshot(s => { S.bucket = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, () => {});
  db.collection('events').onSnapshot(s => { S.events = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, () => {});
  db.doc('pokes/latest').onSnapshot(s => { S.poke = s.exists ? s.data() : null; render(); }, () => {});
  db.collection('moods').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.moods = m; render(); }, () => {});
  db.collection('feeds').onSnapshot(s => { S.feeds = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, () => {});
  db.collection('seen').onSnapshot(s => { const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); S.seen = o; S.seenLoaded = true; render(); }, () => {});
  db.collection('checkins').onSnapshot(s => { S.checkins = s.docs.map(d => ({...d.data(), id: d.id})); S.checkinsLoaded = true; render(); }, () => {});
  db.collection('comments').onSnapshot(s => { S.comments = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, () => {});
  db.collection('stages').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.stages = m; }, () => {});
  db.collection('yard').onSnapshot(s => { S.yard = s.docs.map(d => ({...d.data(), id: d.id})); S.yardLoaded = true; render(); migrateSpots(); }, () => {});
  db.doc('yardcfg/main').onSnapshot(s => { S.ycfg = s.exists ? s.data() : null; S.ycfgLoaded = true; render(); migrateSpots(); }, () => {});
  db.collection('qswaps').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.qswap = m; render(); }, () => {});
  db.collection('prefs').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.prefs = m; render(); }, () => {});
  db.collection('letters').onSnapshot(s => { S.letters = s.docs.map(d => ({...d.data(), id: d.id})); render(); }, () => {});
}
boot();
setInterval(tick, 1000);
}
</script>
