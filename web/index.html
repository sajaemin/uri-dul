<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 둘">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff4f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="backend.js"></script>
<title>우리 둘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday and tender, but grown-up: a calm, native-feeling iPhone app
   IDEA a shipped iOS app: grouped cards on a soft ground, translucent bars, a Live Activity on top
   PICTURE the hero card: days-together number in thin numerals on a rose-to-wine glow; the island where two avatars move toward each other as the date nears
   COLOUR soft grey-rose ground, white cards, near-black ink, one rose accent; indigo for plans, amber for anniversaries; night = true black with lifted cards
   TYPE the iPhone system face (SF + Apple SD Gothic Neo), Noto Sans KR as fallback; thin weights for big numbers
   LAYOUT one phone column (max 560px); sticky island under the header; tab bar fixed at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#f3f1f2,#000000);--card:light-dark(#ffffff,#161416);--ink:light-dark(#17151a,#f3f1f2);--mut:light-dark(#86808a,#9b959c);--acc:light-dark(#e1446a,#ff6f90);--acc2:light-dark(#fcecf0,#35161f);--line:light-dark(rgba(23,21,26,.09),rgba(255,255,255,.1));--fill:light-dark(rgba(23,21,26,.05),rgba(255,255,255,.07));--plan:light-dark(#5263e8,#8a96ff);--ann:light-dark(#d98b1c,#f3b24c);--hol:light-dark(#e0443e,#ff6b64);--out:light-dark(#e7e4e6,#000000)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--out);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;letter-spacing:-.01em;word-break:keep-all;min-height:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:clip}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-bottom:.5px solid var(--line);position:sticky;top:0;z-index:6}
.brand{font-size:19px;font-weight:700;letter-spacing:-.04em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.tag{font-size:13px;color:var(--mut);border:.5px solid var(--line);border-radius:999px;padding:0 8px;line-height:22px;white-space:nowrap}
.who{margin-left:auto;display:flex;background:var(--fill);border-radius:999px;padding:2px}
.who button{border:0;background:none;font-size:14px;padding:0 13px;border-radius:999px;color:var(--mut);min-height:36px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.who button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{flex:1;position:relative;padding-bottom:8px}
.app.has-di main{padding-top:50px}
nav.tabs{position:sticky;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px)}
nav.tabs button{border:0;background:none;font-size:13px;color:var(--mut);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;font-weight:500}
nav.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--acc)}
nav.tabs button[aria-current=page] svg{stroke-width:2.1}
.dot{position:absolute;top:4px;left:calc(50% + 7px);min-width:19px;height:19px;border-radius:10px;background:var(--acc);color:#fff;font-size:13px;line-height:19px;padding:0 5px;font-weight:600;font-variant-numeric:tabular-nums}
/* hero */
.hero{margin:6px 16px 0;border-radius:28px;padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.32),transparent 55%),radial-gradient(80% 70% at 0% 100%,rgba(70,10,45,.55),transparent 70%),linear-gradient(155deg,#ff8ba3 0%,#e1446a 45%,#6a1f4e 100%);box-shadow:0 20px 40px -22px rgba(225,68,106,.7)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.22);pointer-events:none}
.hero::before{width:260px;height:260px;right:-90px;bottom:-120px}
.hero::after{width:180px;height:180px;right:-50px;bottom:-80px;border-color:rgba(255,255,255,.14)}
.pair{display:flex;align-items:center}
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:15px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.75);color:#fff;flex:none}
.pair .av+.av{margin-left:-10px}
.hl{margin:12px 0 0;font-size:15px;font-weight:500;opacity:.95}
.hero .n{font-size:clamp(68px,21vw,104px);font-weight:200;letter-spacing:-.055em;line-height:.95;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.hero .n span{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-left:6px}
.hs{margin:0;font-size:14px;opacity:.9}
/* dynamic island */
.di-wrap{position:absolute;left:0;right:0;top:100%;height:0;display:flex;justify-content:center;pointer-events:none}
.di-wrap:empty{display:none}
.di{pointer-events:auto;position:absolute;top:9px;background:#000;color:#fff;border:0;border-radius:22px;height:38px;min-width:150px;max-width:calc(100% - 40px);padding:0 14px 0 8px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 0 0 1px light-dark(rgba(255,255,255,.06),rgba(255,255,255,.16));font-size:14px;text-align:left}
.di .l{display:flex;align-items:center;gap:8px;min-width:0}
.pulse{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#ff6f90 0 35%,rgba(255,111,144,.25) 36% 100%);flex:none}
.di .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:10em;font-weight:600}
.di .cd{margin-left:auto;color:#ff8aa5;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.di.exp{height:auto;border-radius:38px;width:min(390px,calc(100% - 20px));max-width:none;display:block;padding:18px 22px 16px}
.di.exp>span{display:block}
.dix-top{display:flex!important;justify-content:space-between;gap:10px;font-size:13px;color:rgba(255,255,255,.6)}
.dix-lab{color:#ff8aa5;font-weight:600;white-space:nowrap}
.dix-when{text-align:right;overflow-wrap:anywhere}
.dix-t{font-size:18px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.dix-big{font-size:46px;font-weight:200;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:4px}
/* meet track: two people closing the distance */
.meet{display:block;position:relative;height:36px;margin:12px 2px 2px}
.meet .tr,.meet .fl,.meet .fr{position:absolute;top:50%;height:2px;margin-top:-1px;border-radius:1px}
.meet .tr{left:14px;right:14px;background:var(--line)}
.di .meet .tr{background:rgba(255,255,255,.18)}
.meet .fl,.meet .fr{background:var(--acc);width:0}
.meet .fl{left:0}
.meet .fr{right:0}
.meet .av{position:absolute;top:50%;width:30px;height:30px;font-size:13px;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid var(--acc);color:var(--ink);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.di .meet .av{background:#1b1b1d;color:#fff}
.meet .mh{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);fill:none;stroke:var(--mut);stroke-width:2}
.meet.met .mh{fill:var(--acc);stroke:var(--acc);width:20px;height:20px;top:-6px;z-index:1}
/* content */
.sec{padding:4px 16px 18px}
.sh{font-size:13px;color:var(--mut);margin:22px 6px 8px;font-weight:600;letter-spacing:0}
.card{background:var(--card);border-radius:20px;padding:18px}
.card+.card{margin-top:12px}
h2{font-weight:650;font-size:17px;letter-spacing:-.025em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-size:14px;color:var(--mut);font-weight:500;letter-spacing:0}
.q{font-size:clamp(20px,5.6vw,24px);font-weight:650;line-height:1.38;letter-spacing:-.035em;margin:2px 0 0;text-wrap:balance}
.note{color:var(--mut);font-size:14px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font-weight:600;border:0;border-radius:14px;min-height:48px;padding:0 18px;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:16px}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn.line{background:var(--fill);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.btn:active,.ib:active,.tile:active,.cell:active{transform:scale(.97)}
textarea,select,input[type=text],input[type=date],input[type=time]{min-height:48px;-webkit-appearance:none;appearance:none;font:inherit;font-size:16px;width:100%;border:1px solid transparent;border-radius:12px;padding:12px 14px;background:var(--fill);color:var(--ink)}
textarea:focus,select:focus,input:focus{border-color:var(--acc);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--mut);margin:14px 2px 6px;font-weight:600}
.bub{background:var(--fill);border-radius:18px 18px 18px 6px;padding:12px 15px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px}
.lock{background:var(--fill);border-radius:16px;padding:14px 15px;margin-top:6px;color:var(--mut);font-size:15px}
.who-l{font-size:13px;font-weight:600;margin-top:16px;display:block;color:var(--mut)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.list li:first-child{padding-top:2px}
.list li:last-child{border-bottom:0;padding-bottom:0}
.dd{font-size:15px;font-weight:600;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.date{color:var(--mut);font-size:14px;white-space:nowrap}
.banner{display:flex;align-items:center;gap:10px;background:var(--acc2);color:var(--acc);padding:10px 16px;font-size:15px;font-weight:500}
.banner button{margin-left:auto;border:0;background:none;color:var(--acc);min-height:40px;padding:0 6px;font-size:14px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:11px;padding:2px;margin:14px 0 12px}
.seg button{border:0;background:none;min-height:38px;border-radius:9px;color:var(--ink);font-size:14px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:16px;overflow:hidden}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--fill);overflow:hidden;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tb{position:absolute;left:6px;top:6px;background:var(--acc);color:#fff;font-size:13px;line-height:20px;padding:0 7px;border-radius:10px;font-weight:600}
.tb.ok{background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.thumbs .tile{aspect-ratio:1;border-radius:10px}
.up{border-radius:20px;padding:18px;text-align:center;background:var(--card);border:1.5px dashed color-mix(in srgb,var(--acc) 40%,transparent)}
.up .btn{margin:10px auto 0}
.empty{text-align:center;color:var(--mut);padding:28px 12px;font-size:15px}
/* photo viewer */
.ov{position:fixed;inset:0;max-width:560px;margin:0 auto;background:rgba(0,0,0,.96);color:#fff;display:flex;flex-direction:column;z-index:8;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.ov .bar{display:flex;align-items:center;gap:8px}
.ov .bar button{border:0;background:rgba(255,255,255,.14);color:#fff;min-height:40px;min-width:44px;border-radius:999px;padding:0 14px;font-weight:600}
.ov .pic{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;min-height:0}
.ov .pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.ov .meta{font-size:15px;opacity:.85;margin:0 0 10px;overflow-wrap:anywhere}
.ov .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.toast{position:fixed;left:16px;right:16px;max-width:528px;margin:0 auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:500;z-index:9;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast.on{opacity:1;transform:none}
ol.steps{margin:4px 0 0;padding-left:20px;color:var(--ink);font-size:15px}
ol.steps li{margin:5px 0}
/* next date card */
.nd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.nd-t{font-size:20px;font-weight:650;letter-spacing:-.03em}
.nd-cd{font-size:15px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;margin-top:6px;text-align:center}
/* calendar */
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh h2{margin:0;flex:1;text-align:center;justify-content:center;font-size:19px}
.ib{border:0;background:var(--fill);border-radius:12px;min-width:44px;min-height:40px;font-size:20px;color:var(--ink);line-height:1}
.ib.sm{font-size:14px;min-height:34px;min-width:0;padding:0 12px;flex:none;font-weight:600;border-radius:999px}
.calbox{background:var(--card);border-radius:20px;padding:12px 8px 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{text-align:center;font-size:13px;color:var(--mut);padding:2px 0 6px;font-weight:600}
.sun .dn,.cal .wd.sun{color:var(--hol)}
.sat .dn,.cal .wd.sat{color:var(--plan)}
.cell{border:0;background:none;border-radius:12px;min-height:52px;display:flex;flex-direction:column;align-items:center;padding:3px 0 4px;gap:3px;font-size:16px;font-variant-numeric:tabular-nums}
.cell.out{opacity:.3}
.cell .dn{width:34px;height:34px;line-height:34px;border-radius:17px;text-align:center}
.cell.today .dn{color:var(--acc);font-weight:700}
.cell.sel .dn{background:var(--ink);color:var(--bg);font-weight:600}
.cell.sel.today .dn{background:var(--acc);color:#fff}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.k-date{background:var(--acc)}
.k-plan{background:var(--plan)}
.k-anniv,.k-bday{background:var(--ann)}
.k-hol{background:var(--hol)}
.k-photo{background:var(--mut)}
.tagk{font-size:13px;padding:0 8px;border-radius:7px;white-space:nowrap;display:inline-block;line-height:21px;font-weight:600;vertical-align:1px}
.tagk.k-date{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
.tagk.k-plan{color:var(--plan);background:color-mix(in srgb,var(--plan) 13%,transparent)}
.tagk.k-anniv,.tagk.k-bday{color:var(--ann);background:color-mix(in srgb,var(--ann) 15%,transparent)}
.tagk.k-hol{color:var(--hol);background:color-mix(in srgb,var(--hol) 13%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin:10px 8px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ag li{align-items:flex-start}
.ag .t{width:3.4em;flex:none;color:var(--mut);font-size:14px;white-space:nowrap;padding-top:1px;font-variant-numeric:tabular-nums}
.ag .m{flex:1;overflow-wrap:anywhere}
.ag .s{font-size:14px;color:var(--mut)}
.remind{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 45%,transparent)}
.sheet-bg{position:fixed;inset:0;max-width:560px;margin:0 auto;background:rgba(0,0,0,.4);z-index:7;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-size:13px;color:var(--mut);padding:0 2px;margin-bottom:2px;font-weight:600}
.chk{display:inline-flex;align-items:center;gap:7px;margin:4px 14px 4px 0;min-height:40px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--acc);margin:0}
/* cover photo hero (modern) */
.hero .hin{position:relative;z-index:1}
.hero.photo{min-height:min(112vw,430px);display:flex;flex-direction:column;justify-content:flex-end;background:#2a1520}
.hero.photo::before,.hero.photo::after{display:none}
.hero .cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 45%,rgba(24,4,14,.78))}
/* theme picker */
.looks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.look{background:var(--card);border:2px solid transparent;border-radius:20px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.look[aria-pressed=true]{border-color:var(--acc)}
.look b{font-size:16px;margin-top:8px}
.lk{display:block;height:88px;border-radius:14px}
.lk.m{background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.3),transparent 55%),linear-gradient(155deg,#ff8ba3,#e1446a 45%,#6a1f4e)}
.lk.c{background:radial-gradient(circle at 36% 72%,#ffd9b3 0 15%,transparent 16%),radial-gradient(circle at 64% 72%,#ffc7d8 0 15%,transparent 16%),radial-gradient(ellipse at 50% 120%,#cfeedd 0 45%,transparent 46%),linear-gradient(180deg,#ffd9e4,#fff4e6)}
/* cute (러블리) look */
.app[data-look=cute]{--bg:light-dark(#fff4f7,#1e1418);--card:light-dark(#ffffff,#2a1d23);--ink:light-dark(#4b2f3a,#fbe8ef);--mut:light-dark(#a8848f,#c29fab);--acc:light-dark(#ff6f98,#ff8fb0);--acc2:light-dark(#ffe3ec,#47242f);--line:light-dark(#f8dbe4,#45303a);--fill:light-dark(#fff0f4,#3a2830);--plan:light-dark(#5d9cff,#8fbcff);--ann:light-dark(#f5a300,#ffc457);--out:light-dark(#ffe6ee,#120b0e)}

.app[data-look=cute] .bub{border-radius:22px 22px 22px 8px}

.bi{align-items:flex-start!important;justify-content:flex-start!important}

ol.steps.big li{margin:10px 0;font-size:16px}

{
